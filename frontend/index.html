<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Oh My Terminal" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=IBM+Plex+Mono:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Nanum+Gothic+Coding:wght@400;700&family=Source+Code+Pro:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <title>Oh My Terminal</title>
  <script>
    // Track the visual viewport at parse time (before first paint):
    //  - --th-vh-unit: 1% of the visible height. iOS reports 1vh as the max
    //    viewport behind the URL bar, which otherwise overflows on first load.
    //  - --th-vv-top / --th-vv-left: the visual viewport's pan offset. When
    //    the keyboard opens, iOS pans the visual viewport to keep the focused
    //    input visible; #root translates by this offset to stay glued to the
    //    visible region instead of being carried off-screen (see global.css).
    (function () {
      var rootStyle = document.documentElement.style;
      var baselineWidth = 0;
      var baselineHeight = 0;
      var set = function () {
        var vv = window.visualViewport;
        var h = vv ? vv.height : window.innerHeight;
        var w = vv ? vv.width : window.innerWidth;
        if (!baselineWidth || Math.abs(w - baselineWidth) > 1) {
          baselineWidth = w;
          baselineHeight = h;
        } else if (h > baselineHeight) {
          baselineHeight = h;
        }
        rootStyle.setProperty("--th-vh-unit", h * 0.01 + "px");
        rootStyle.setProperty("--th-vv-top", vv ? vv.offsetTop + "px" : "0px");
        rootStyle.setProperty("--th-vv-left", vv ? vv.offsetLeft + "px" : "0px");
        document.documentElement.toggleAttribute(
          "data-th-keyboard-open",
          baselineHeight - h > 100,
        );
      };
      var reset = function () {
        baselineWidth = 0;
        set();
      };
      set();
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", set);
        window.visualViewport.addEventListener("scroll", set);
      }
      window.addEventListener("scroll", set, { passive: true });
      window.addEventListener("orientationchange", reset);
      window.addEventListener("pageshow", reset);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
